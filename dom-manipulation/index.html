<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Quote Generator (v2)</title>
    <!-- Load Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Configure Tailwind for the Inter font and default styling
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for aesthetics */
        .quote-list-container::-webkit-scrollbar { width: 8px; }
        .quote-list-container::-webkit-scrollbar-thumb {
            background-color: #a7f3d0; /* emerald-200 */
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen p-4 sm:p-8 flex items-start justify-center">

    <div id="app" class="w-full max-w-4xl space-y-8">

        <!-- Header and Title -->
        <header class="text-center">
            <h1 class="text-4xl sm:text-5xl font-extrabold text-emerald-700 mb-2">Dynamic Quote Generator</h1>
            <p class="text-xl text-gray-500">Quotes are persistent and can be exported/imported!</p>
        </header>

        <!-- Main Quote Display Card -->
        <div class="bg-white p-6 sm:p-10 rounded-xl shadow-2xl border-b-4 border-emerald-400">
            <div id="quote-display" class="min-h-[150px] flex flex-col justify-center items-center">
                <p id="current-quote" class="text-2xl sm:text-3xl italic text-gray-800 text-center mb-4 leading-relaxed">
                    Loading quotes...
                </p>
                <div id="quote-meta" class="text-sm font-medium text-emerald-500 tracking-wider uppercase">
                    — Initializing
                </div>
            </div>

            <div class="mt-8 flex flex-col sm:flex-row gap-4 justify-center items-center">
                <!-- Category Filter -->
                <select id="category-filter" class="p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-emerald-500 focus:border-emerald-500 transition duration-150">
                    <option value="all">All Categories</option>
                </select>

                <!-- Show New Quote Button -->
                <button onclick="showRandomQuote()" class="w-full sm:w-auto px-6 py-3 bg-emerald-600 text-white font-bold rounded-lg shadow-md hover:bg-emerald-700 transition duration-150 transform hover:scale-[1.02] active:scale-95">
                    Show New Quote
                </button>
            </div>
        </div>

        <!-- Utility Section: Add Quote & Quote List -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- Dynamic Add Quote Form -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h2 class="text-2xl font-semibold text-gray-700 mb-4 flex justify-between items-center">
                    Add Your Own Quote
                    <button id="toggle-add-form" onclick="toggleAddForm()" class="text-emerald-500 hover:text-emerald-700 text-sm font-medium">
                        Hide Form
                    </button>
                </h2>
                <div id="add-quote-form-container" class="space-y-4">
                    <input type="text" id="new-quote-text" placeholder="Enter quote text..." class="w-full p-3 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 transition duration-150">
                    <input type="text" id="new-quote-category" placeholder="Enter category (e.g., 'Love', 'Wisdom')" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500 transition duration-150">
                    <button onclick="handleAddQuote()" class="w-full py-3 bg-indigo-500 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-600 transition duration-150 transform hover:scale-[1.01] active:scale-95">
                        Add Quote
                    </button>
                    <p id="feedback-message" class="text-sm text-center pt-2 h-6"></p>
                </div>
            </div>

            <!-- Current Quote List -->
            <div class="bg-white p-6 rounded-xl shadow-lg">
                <h2 class="text-2xl font-semibold text-gray-700 mb-4">
                    Available Quotes (<span id="quote-count">0</span>)
                </h2>
                <div id="quote-list" class="space-y-3 max-h-72 overflow-y-auto quote-list-container">
                    <p class="text-gray-400">Quotes will appear here after loading...</p>
                </div>
            </div>
        </div>

        <!-- Data Management Section: Import/Export -->
        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-2xl font-semibold text-gray-700 mb-4">Data Management (JSON)</h2>
            <div class="flex flex-col sm:flex-row gap-4">
                <!-- Export Button -->
                <button onclick="exportQuotes()" class="flex-1 py-3 bg-blue-500 text-white font-semibold rounded-lg shadow-md hover:bg-blue-600 transition duration-150 transform hover:scale-[1.01] active:scale-95">
                    Export Quotes (.json)
                </button>
                <!-- Import Field and Label (Label acts as the button for the hidden file input) -->
                <label for="import-file" class="flex-1 py-3 bg-purple-500 text-white font-semibold rounded-lg shadow-md hover:bg-purple-600 transition duration-150 transform hover:scale-[1.01] active:scale-95 text-center cursor-pointer">
                    Import Quotes (.json)
                </label>
                <!-- File input is hidden but triggered by the label click -->
                <input type="file" id="import-file" accept=".json" class="hidden" onchange="importQuotes(event)">
            </div>
            <p id="import-export-feedback" class="text-sm text-center pt-2 h-6"></p>
        </div>
    </div>

    <!-- Link to the main JavaScript file. Note: functions are globally accessible. -->
    <script src="script.js"></script>
</body>
</html>
